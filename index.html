<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Francesco Presti | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="preloader">
  <div class="preloader-text" data-text="FRANCESCO PRESTI">FRANCESCO PRESTI</div>
</div>

<div id="scroll-cursor">
  <div id="cursor-dot"></div>
  <svg viewBox="0 0 120 120" width="120" height="120">
    <defs>
      <path id="circlePath" d="M 60,60 m -40,0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" fill="none"/>
    </defs>
    <text font-size="10" fill="currentColor" letter-spacing="2.5">
      <textPath href="#circlePath">SCROLL DOWN · SCROLL DOWN · </textPath>
    </text>
  </svg>
</div>

<div id="bg-tint"></div>
<div class="about-gradient"></div>

<video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
  <source src="assets/img/background.mp4" type="video/mp4">
</video>

<header class="header-container">
  <h1 id="glow-text">
    <span>F</span><span>R</span><span>A</span><span>N</span><span>C</span><span>E</span><span>S</span><span>C</span><span>O</span>
    <span>&nbsp;</span>
    <span>P</span><span>R</span><span>E</span><span>S</span><span>T</span><span>I</span>
  </h1>
  <div class="settings-group">
    <button id="langBtn" class="settings-btn lang-btn" aria-label="Switch Language">EN</button>
    <button id="muteBtn" class="settings-btn mute-btn" aria-label="Toggle Sound">
      <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </div>
</header>

<div id="scroll-wrap">

  <section id="about-section" class="section">
    <div class="section-content">
      <div class="title-with-icon reveal-item">
        <img src="assets/img/aboutme.webp" class="title-icon" alt="About Icon">
        <h2 id="about-title">About Me</h2>
      </div>
      <div id="about-content" class="about-body reveal-item reveal-d1"></div>
    </div>
  </section>

  <section id="resume-section" class="section">
    <div class="section-content section-content--resume">
      <div class="title-with-icon reveal-item">
        <img src="assets/img/User_Square.webp" class="title-icon" alt="Resume Icon">
        <h2 id="resume-title">Resume</h2>
      </div>
      <div class="resume-layout reveal-item reveal-d1">
        <img id="cvImage" src="assets/img/CV_Presti_Francesco_ENG.jpg" alt="CV Preview" class="cv-preview">
        <a id="cvDownloadBtn" href="assets/CV/CV_Presti_Francesco_ENG.pdf" download class="simple-download-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download CV</span>
        </a>
      </div>
    </div>
  </section>

  <section id="contact-section" class="section">
    <div class="contact-orb contact-orb--1"></div>
    <div class="contact-orb contact-orb--2"></div>
    <div class="contact-orb contact-orb--3"></div>
    <div class="section-content">
      <div class="title-with-icon reveal-item">
        <img src="assets/img/contactme.webp" class="title-icon" alt="Contact Icon">
        <h2 id="contact-title">Contact Me</h2>
      </div>
      <div class="contact-body reveal-item reveal-d1">
        <div id="contact-desc"></div>
        <div class="contact-details">
          <div class="email-row">
            <span class="email-text">francescopresti29@hotmail.it</span>
            <button id="copyEmailBtn" class="copy-btn" title="Copy Email">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div class="contact-actions">
            <a href="mailto:francescopresti29@hotmail.it" id="sendEmailBtn" class="send-email-btn">
              <span class="btn-text">Send Email</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </a>
            <a href="https://www.linkedin.com/in/francesco-presti-swarm" target="_blank" class="linkedin-contact-btn">
              <img src="assets/img/linkedin_logo.webp" alt="LinkedIn">
              <span>LinkedIn</span>
            </a>
          </div>
          <p id="contact-note" style="font-size:12px; margin-top:10px;"></p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <span>© 2025 By Francesco Presti</span>
    </div>
  </footer>

</div>

<div class="nav-container">
  <nav class="nav-menu">
    <div class="nav-item active" data-target="about-section">About Me</div>
    <div class="nav-item" data-target="resume-section">Resume</div>
    <div class="nav-item" data-target="contact-section">Contact Me</div>
  </nav>
  <a href="https://www.linkedin.com/in/francesco-presti-swarm" target="_blank" class="linkedin-link">
    <img src="assets/img/linkedin_logo.webp" class="linkedin-icon" alt="LinkedIn">
  </a>
</div>

<div class="dev-warning" id="mobileWarning">
  <span id="warning-text">⚠️ Optimized for desktop. Mobile features a simplified layout.</span>
  <button class="close-warning" id="closeMobileWarning">&times;</button>
</div>

<script src="script.js"></script>
</body>
</html>
